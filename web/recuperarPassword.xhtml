<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña - Great Viaggio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0f2f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            max-width: 520px;
            width: 100%;
            padding: 32px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            color: #ffffff;
        }

        p.subtitle {
            margin: 0 0 20px;
            color: #cfd8dc;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #b2dfdb;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #2dd4bf;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.3px;
            width: 100%;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2dd4bf 0%, #0ea5e9 100%);
            color: #0b1f33;
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(14, 165, 233, 0.4);
        }

        .btn-secondary {
            margin-top: 10px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #e0f2f1;
        }

        .messages {
            margin-bottom: 12px;
        }

        .messages .info {
            background: rgba(13, 148, 136, 0.15);
            border: 1px solid rgba(45, 212, 191, 0.4);
            color: #a7f3d0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .messages .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fecdd3;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .section-title {
            margin: 20px 0 10px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a7f3d0;
        }

        .helper-text {
            color: #b2dfdb;
            font-size: 13px;
            margin-top: -6px;
            margin-bottom: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a7f3d0;
            text-decoration: none;
            font-weight: 600;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Recuperar contraseña</h1>
        <p class="subtitle">Ingresa tu correo registrado. Te enviaremos un código de verificación para que puedas definir una nueva contraseña.</p>

        <h:form id="recuperacionForm">
            <h:messages styleClass="messages" infoClass="info" errorClass="error" warnClass="error" />

            <h:panelGroup layout="block">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <h:inputText id="email" value="#{recuperacionPasswordBean.email}" required="true"
                                 requiredMessage="El correo es obligatorio" styleClass="input" />
                    <small class="helper-text">Usa el correo con el que te registraste.</small>
                </div>

                <h:commandButton value="Enviar código" actionListener="#{recuperacionPasswordBean.enviarCodigo}"
                                 styleClass="btn btn-primary" />
            </h:panelGroup>

            <h:panelGroup rendered="#{recuperacionPasswordBean.codigoEnviado}" layout="block">
                <div class="section-title">Validar código y nueva contraseña</div>

                <div class="input-group">
                    <label for="codigo">Código de verificación</label>
                    <h:inputText id="codigo" value="#{recuperacionPasswordBean.codigoVerificacion}" maxlength="6" styleClass="input" />
                </div>

                <div class="input-group">
                    <label for="pass1">Nueva contraseña</label>
                    <h:inputSecret id="pass1" value="#{recuperacionPasswordBean.nuevaPassword}" styleClass="input" />
                </div>

                <div class="input-group">
                    <label for="pass2">Confirmar contraseña</label>
                    <h:inputSecret id="pass2" value="#{recuperacionPasswordBean.confirmarPassword}" styleClass="input" />
                </div>

                <h:commandButton value="Restablecer contraseña" actionListener="#{recuperacionPasswordBean.validarYRestablecer}"
                                 styleClass="btn btn-primary" />
            </h:panelGroup>
        </h:form>

        <a class="back-link" href="login.xhtml"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
    </div>
</body>
</html>
