<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Great Viggio Hotel</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #102544;
                color: #0f172a;
                padding: 24px;
            }

            .login-card {
                width: 100%;
                max-width: 960px;
                background: #ffffff;
                border-radius: 18px;
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
                display: grid;
                grid-template-columns: 1fr 1fr;
                overflow: hidden;
            }

            .login-hero {
                background: linear-gradient(135deg, #0ea5e9, #2563eb);
                color: #e0f2fe;
                padding: 48px 40px;
                display: flex;
                flex-direction: column;
                gap: 18px;
                justify-content: center;
            }

            .login-hero .logo {
                width: 96px;
                height: 96px;
                border-radius: 50%;
                border: 3px solid rgba(255, 255, 255, 0.4);
                display: grid;
                place-items: center;
                background: rgba(255, 255, 255, 0.1);
            }

            .login-hero .logo i {
                font-size: 36px;
                color: #fff;
            }

            .login-hero h1 {
                font-size: 32px;
                letter-spacing: 1px;
                font-weight: 600;
            }

            .login-hero p {
                font-size: 15px;
                line-height: 1.6;
                color: #e2e8f0;
            }

            .login-form {
                padding: 48px 40px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                background: #f8fafc;
            }

            .login-form h2 {
                font-size: 26px;
                color: #0f172a;
                margin-bottom: 4px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .form-label {
                font-weight: 600;
                color: #0f172a;
            }

            .form-input {
                width: 100%;
                padding: 14px 16px;
                border-radius: 12px;
                border: 1px solid #cbd5e1;
                font-size: 15px;
                background: #fff;
                color: #0f172a;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .form-input:focus {
                outline: none;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            }

            .error-message {
                color: #dc2626;
                font-size: 13px;
            }

            .actions {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 4px 0 8px;
            }

            .btn-primary {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: #fff;
                border: none;
                padding: 14px 16px;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
                transition: transform 0.15s ease, box-shadow 0.2s ease;
                width: 100%;
            }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 14px 32px rgba(37, 99, 235, 0.45);
            }

            .btn-primary:active {
                transform: translateY(0);
            }

            .links {
                text-align: center;
                color: #334155;
                font-size: 14px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .links a {
                color: #2563eb;
                font-weight: 600;
                text-decoration: none;
            }

            .links a:hover {
                text-decoration: underline;
            }

            @media (max-width: 880px) {
                .login-card {
                    grid-template-columns: 1fr;
                }

                .login-hero {
                    align-items: center;
                    text-align: center;
                }
            }
        </style>
    </h:head>
    <h:body>
        <div class="login-card">
            <div class="login-hero">
                <div class="logo">
                    <i class="fas fa-hotel"></i>
                </div>
                <h1>Great Viggio Hotel</h1>
                <p>Ingresa con tu cuenta para acceder al sistema. Hemos simplificado esta vista para que cargue rápido y siempre muestre los campos.</p>
            </div>

            <div class="login-form">
                <h2>Iniciar sesión</h2>

                <h:form id="loginForm" prependId="false">
                    <div class="form-group">
                        <label class="form-label" for="EmailUser">Correo electrónico</label>
                        <h:inputText id="EmailUser"
                                     value="#{usuarioBean.usuario.email}"
                                     required="true"
                                     requiredMessage="Debe especificar un email"
                                     styleClass="form-input"
                                     autocomplete="username"
                                     />
                        <h:message for="EmailUser" styleClass="error-message" />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="PwUsr">Contraseña</label>
                        <h:inputSecret id="PwUsr"
                                       value="#{usuarioBean.usuario.password}"
                                       required="true"
                                       requiredMessage="Debe especificar una contraseña"
                                       styleClass="form-input"
                                       autocomplete="current-password"
                                       />
                        <h:message for="PwUsr" styleClass="error-message" />
                    </div>

                    <h:commandButton value="Acceder" actionListener="#{usuarioBean.autenticar}" styleClass="btn-primary" />

                    <div class="links">
                        <a href="recuperarPassword.xhtml">¿Olvidaste tu contraseña?</a>
                        <span>¿Nuevo usuario? <a href="registro.xhtml">Crear cuenta</a></span>
                        <a href="index.html">Volver al inicio</a>
                    </div>
                </h:form>
            </div>
        </div>

        <script src="js/login.js"></script>
    </h:body>
</html>
