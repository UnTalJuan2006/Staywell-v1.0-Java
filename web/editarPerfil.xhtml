<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="es">
    <f:metadata>
        <f:viewAction action="#{usuarioBean.cargarUsuarioPorId()}" />
    </f:metadata>
    <h:head>
        <title>Editar usuario</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
        <style>
            :root {
    --primary: #1a7c8f;
    --primary-900: #115d6b;
    --accent: #ffd166;
    --surface: #ffffff;
    --muted: #6b7280;
    --background: #f4f6f9;
}

* {
    box-sizing: border-box;
}

body {
    background: var(--background);
    color: #111827;
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 260px;
    background: var(--primary);
    color: #fff;
    z-index: 1000;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.08);
}

.sidebar-header {
    padding: 28px 20px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    text-align: center;
}

.sidebar-header h4 {
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.sidebar-header p {
    margin: 6px 0 0;
    opacity: 0.9;
}

.sidebar-nav {
    padding: 8px 12px 60px;
}

.sidebar-nav .nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    color: rgba(255, 255, 255, 0.9);
    text-decoration: none;
    border-radius: 10px;
    transition: all 0.2s ease;
    margin: 3px 0;
    font-weight: 500;
}

.sidebar-nav .nav-link:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
}

.sidebar-nav .nav-link.active {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border-left: 4px solid var(--accent);
}

.sidebar-footer {
    margin-top: auto;
    padding: 18px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
}

.sidebar-footer .btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 12px;
    font-weight: 600;
}

.main-content {
    margin-left: 260px;
    padding: 28px;
}

.top-bar {
    background: linear-gradient(90deg, #ffffff 0%, #eff6f7 100%);
    padding: 18px 22px;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(17, 93, 107, 0.08);
}

.page-title {
    display: flex;
    flex-direction: column;
}

.page-title h2 {
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.2px;
}

.page-title span {
    color: var(--muted);
    font-size: 0.95rem;
}

.card {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(17, 93, 107, 0.08);
}

.card-header {
    border-bottom: 1px solid #e5e7eb;
    background: linear-gradient(90deg, rgba(26, 124, 143, 0.08) 0%, rgba(26, 124, 143, 0.02) 100%);
}

.card-header h5 {
    margin: 0;
    font-weight: 700;
    color: #0f2e36;
}

.form-card, .detail-card {
    max-width: 1040px;
    margin: 22px auto;
}

.form-label {
    font-weight: 600;
    color: #0f172a;
}

.form-control, .form-select {
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
}

.form-control:focus, .form-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 0.2rem rgba(17, 93, 107, 0.15);
}

.section-helper {
    color: var(--muted);
    font-size: 0.95rem;
}

.btn-primary {
    background-color: var(--primary);
    border-color: var(--primary);
    border-radius: 12px;
    padding: 10px 16px;
    font-weight: 600;
    box-shadow: 0 8px 18px rgba(26, 124, 143, 0.3);
}

.btn-secondary, .btn-outline-secondary {
    border-radius: 12px;
    font-weight: 600;
}

.detail-item {
    padding: 14px 0;
    border-bottom: 1px dashed #e5e7eb;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
}

.detail-item:last-child {
    border-bottom: none;
}

.detail-item span:first-child {
    color: var(--muted);
    font-weight: 700;
    text-transform: capitalize;
}

.detail-item .label {
    color: var(--muted);
    font-weight: 600;
    text-transform: capitalize;
}

.badge-soft {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(26, 124, 143, 0.12);
    color: var(--primary-900);
    font-weight: 700;
    font-size: 0.9rem;
}

.alert {
    border-radius: 12px;
    border: 1px solid #facc15;
    background: #fef9c3;
    color: #854d0e;
    padding: 12px 16px;
}

@media (max-width: 992px) {
    .sidebar {
        width: 220px;
    }
    .main-content {
        margin-left: 0;
        padding: 18px;
    }
    .top-bar {
        margin-left: 0;
    }
}

        </style>
    </h:head>

    <h:body>
        <div class="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-hotel"></i> StayWell</h4>
                <p>Panel Admin</p>
            </div>

            <nav class="sidebar-nav">
                <h:link outcome="/HomeAdmin.xhtml" styleClass="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</h:link>
                <h:link outcome="/Habitaciones.xhtml" styleClass="nav-link"><i class="bi bi-door-open me-2"></i> Habitaciones</h:link>
                <h:link outcome="/TipoHabitacion.xhtml" styleClass="nav-link"><i class="bi bi-journal-bookmark me-2"></i> Catalogo Habitaciones</h:link>
                <h:link outcome="/Eventos.xhtml" styleClass="nav-link"><i class="bi bi-calendar-event me-2"></i> Eventos</h:link>
                <h:link outcome="/Usuarios.xhtml" styleClass="nav-link"><i class="bi bi-people me-2"></i> Usuarios</h:link>
                <h:link outcome="/Reservas.xhtml" styleClass="nav-link "><i class="bi bi-journal-bookmark me-2"></i> Reservas</h:link>
                <h:link outcome="/Empleados.xhtml" styleClass="nav-link"><i class="bi bi-person-badge me-2"></i> Empleados</h:link>
                <h:link outcome="/Espacios.xhtml" styleClass="nav-link"><i class="bi bi-building me-2"></i> Espacios</h:link>
                <h:link outcome="/Correos.xhtml" styleClass="nav-link"><i class="bi bi-envelope me-2"></i> Correos</h:link>
                <h:link outcome="/.xhtml" styleClass="nav-link"><i class="bi bi-bar-chart me-2"></i> Mantenimientos</h:link>
            </nav>

            <h:form>
                <div class="sidebar-footer">
                    <h:commandLink action="#{usuarioBean.cerrarSesion}" styleClass="btn btn-outline-light btn-sm w-100">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </h:commandLink>
                </div>
            </h:form>
        </div>

        <div class="main-content">
            <div class="top-bar d-flex justify-content-between align-items-center">
                <h2><i class="bi bi-pencil-square"></i> Editar Usuario</h2>
                <h:link outcome="/perfil.xhtml" styleClass="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </h:link>
            </div>

            <div class="mt-4 form-card">
                <h:messages styleClass="alert alert-warning" layout="table" />

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Actualizar datos</h5>

                        <h:form id="formUsuario" enctype="multipart/form-data" styleClass="usuario-form">

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <h:inputText id="nombre" value="#{usuarioBean.usuario.nombre}" 
                                                 styleClass="form-control" required="true" />
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <h:inputText id="email" value="#{usuarioBean.usuario.email}" 
                                                 styleClass="form-control" required="true" />
                                </div>
                                <div class="col-md-6">
                                    <label for="direccion" class="form-label">Dirección</label>
                                    <h:inputText id="direccion" value="#{usuarioBean.usuario.direccion}" 
                                                 styleClass="form-control" required="true" />
                                </div>

                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <h:inputText id="telefono" value="#{usuarioBean.usuario.telefono}" 
                                                 styleClass="form-control" required="true" />
                                </div>
                                <div class="col-12 d-flex justify-content-end mt-3">
                                    <h:commandButton value="Actualizar" action="#{usuarioBean.actualizar()}" 
                                                     styleClass="btn btn-primary me-2" />
                                    <h:link outcome="/perfil.xhtml" styleClass="btn btn-secondary">
                                        Cancelar
                                    </h:link>
                                </div>

                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>

    </h:body>
</html>
