<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Registro de Usuario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url("#{request.contextPath}/img/fondo.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0px 0px 40px rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
            animation: slideUp 0.8s ease-out forwards;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 0 12px;
            margin-bottom: 18px;
            width: 100%;
            height: 45px;
            box-sizing: border-box;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            width: 100%;
            height: 100%;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .mensaje-error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .mensaje-exito {
            color: #4ade80;
            text-align: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        p {
            text-align: center;
            color: white;
            margin-top: 15px;
        }

        a {
            color: #c084fc;
            text-decoration: none;
        }
    </style>
</h:head>

<h:body>

<div class="form-container">
    <h2>Registro de Usuario</h2>

    <!-- MENSAJES GENERALES -->
    <h:messages globalOnly="true"
                styleClass="mensaje-error"
                infoClass="mensaje-exito"/>

    <h:form>

        <!-- NOMBRE -->
        <div class="input-box">
            <h:inputText id="nombre" value="#{usuarioBean.usuario.nombre}">
                <f:passThroughAttribute name="placeholder" value="Nombre"/>
            </h:inputText>
        </div>
        <h:message for="nombre" styleClass="mensaje-error"/>

        <!-- EMAIL -->
        <div class="input-box">
            <h:inputText id="email" value="#{usuarioBean.usuario.email}"
                         validatorMessage="Ingrese un correo válido (ejemplo@dominio.com)">
                <f:passThroughAttribute name="placeholder" value="Email"/>
<!--                <f:validateRegex
                    pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"/>-->
                <f:ajax event="blur" execute="@this" render="emailMsg"/>
            </h:inputText>
        </div>
        <h:message id="emailMsg" for="email" styleClass="mensaje-error"/>

        <!-- TELÉFONO -->
        <div class="input-box">
            <h:inputText id="telefono" value="#{usuarioBean.usuario.telefono}">
                <f:passThroughAttribute name="placeholder" value="Teléfono"/>
            </h:inputText>
        </div>
        <h:message for="telefono" styleClass="mensaje-error"/>

        <!-- DIRECCIÓN -->
        <div class="input-box">
            <h:inputText id="direccion" value="#{usuarioBean.usuario.direccion}">
                <f:passThroughAttribute name="placeholder" value="Dirección"/>
            </h:inputText>
        </div>
        <h:message for="direccion" styleClass="mensaje-error"/>

        <!-- CONTRASEÑA -->
        <div class="input-box">
            <h:inputSecret id="password"
                           value="#{usuarioBean.usuario.password}"
                           validatorMessage="Debe tener mínimo 8 caracteres con mayúscula, minúscula, número y símbolo">
                <f:passThroughAttribute name="placeholder" value="Contraseña"/>

<!--                <f:validateRegex
                    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[!@#$%^&amp;*()_+\\-=\\[\\]{};':&quot;\\|,.&lt;&gt;/?]).{8,}$"/>-->

                <f:ajax event="blur" execute="@this" render="passwordMsg"/>
            </h:inputSecret>
        </div>
        <h:message id="passwordMsg" for="password" styleClass="mensaje-error"/>

        <!-- BOTÓN -->
        <h:commandButton value="Registrar"
                         action="#{usuarioBean.agregar}"
                         styleClass="btn-submit"
                         />

    </h:form>

    <p>
        ¿Ya tienes cuenta?
        <h:link outcome="login.xhtml" value="Inicia sesión"/>
    </p>
</div>

</h:body>
</html>
