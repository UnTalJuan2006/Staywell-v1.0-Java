<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="es">
    <h:head>
        <title>Nuevo Evento</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
        <link rel="stylesheet" href="../css/admin-crud.css" />
    </h:head>

    <h:body>
        <div class="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-hotel"></i> StayWell</h4>
                <p>Panel Admin</p>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/HomeAdmin.xhtml" styleClass="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</h:link>
                <h:link outcome="/Habitaciones.xhtml" styleClass="nav-link"><i class="bi bi-door-open me-2"></i> Habitaciones</h:link>
                <h:link outcome="/TipoHabitacion.xhtml" styleClass="nav-link"><i class="bi bi-journal-bookmark me-2"></i> Catalogo Habitaciones</h:link>
                <h:link outcome="/Eventos.xhtml" styleClass="nav-link active"><i class="bi bi-calendar-event me-2"></i> Eventos</h:link>
                <h:link outcome="/Usuarios.xhtml" styleClass="nav-link"><i class="bi bi-people me-2"></i> Usuarios</h:link>
                <h:link outcome="/Reservas.xhtml" styleClass="nav-link"><i class="bi bi-journal-bookmark me-2"></i> Reservas</h:link>
                <h:link outcome="/Empleados.xhtml" styleClass="nav-link"><i class="bi bi-person-badge me-2"></i> Empleados</h:link>
                <h:link outcome="/Espacios.xhtml" styleClass="nav-link"><i class="bi bi-building me-2"></i> Espacios</h:link>
                <h:link outcome="/Correos.xhtml" styleClass="nav-link"><i class="bi bi-envelope me-2"></i> Correos</h:link>
            </nav>
            <h:form>
                <div class="sidebar-footer">
                    <h:commandLink action="#{usuarioBean.cerrarSesion}" styleClass="btn btn-outline-light btn-sm w-100">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </h:commandLink>
                </div>
            </h:form>
        </div>

        <div class="main-content">
            <div class="top-bar d-flex justify-content-between align-items-center">
                <h2><i class="bi bi-plus-circle"></i> Nuevo Evento</h2>
                <h:link outcome="/Eventos.xhtml" styleClass="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</h:link>
            </div>

            <div class="mt-4 form-card">
                <h:messages styleClass="alert alert-warning" layout="table" />
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Datos del evento</h5>
                        <h:form id="formEvento" styleClass="reserva-form">

                            <h:outputText id="ocupacionesJson" value="#{eventoBean.fechasOcupadasJson}" styleClass="d-none" />

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label for="nombreEvento" class="form-label">Nombre del Evento</label>
                                    <h:inputText id="nombreEvento"
                                                 value="#{eventoBean.evento.nombreEvento}"
                                                 styleClass="form-control"
                                                 required="true"
                                                 requiredMessage="El nombre del evento es obligatorio." />
                                    <h:message for="nombreEvento" styleClass="text-danger small" />
                                </div>

                                <div class="col-md-6">
                                    <label for="fechaEvento" class="form-label">Fecha del Evento</label>
                                    <h:inputText id="fechaEvento" value="#{eventoBean.evento.fechaEvento}"
                                                 styleClass="form-control"
                                                 required="true"
                                                 requiredMessage="Debe indicar la fecha del evento.">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                        <f:ajax event="change"
                                                listener="#{eventoBean.validarFechasAjax}"
                                                execute="@this"
                                                render="ocupacionesJson @messages"/>
                                    </h:inputText>

                                    <h:message for="fechaEvento" styleClass="text-danger small" />
                                </div>

                                <div class="col-md-6">
                                    <label for="horaInicio" class="form-label">Hora Inicio</label>
                                    <h:inputText id="horaInicio" value="#{eventoBean.evento.horaInicio}"
                                                 styleClass="form-control" readonly="true"
                                                 converter="localTimeConverter"
                                                 required="true"
                                                 requiredMessage="Debe indicar la hora de inicio."/>
                                    <h:message for="horaInicio" styleClass="text-danger small" />
                                </div>

                                <div class="col-md-6">
                                    <label for="horaFin" class="form-label">Hora Fin</label>
                                    <h:inputText id="horaFin" value="#{eventoBean.evento.horaFin}"
                                                 styleClass="form-control" readonly="true"
                                                 converter="localTimeConverter"
                                                 required="true"
                                                 requiredMessage="Debe indicar la hora de finalización."/>
                                    <h:message for="horaFin" styleClass="text-danger small" />
                                </div>

                                <div class="col-md-6">
                                    <label for="espacio" class="form-label">Espacio</label>
                                    <h:selectOneMenu id="espacio" value="#{eventoBean.espacioIdSeleccionado}"
                                                     styleClass="form-select"
                                                     required="true"
                                                     requiredMessage="Debe seleccionar un espacio.">
                                        <f:selectItem itemLabel="Seleccione un espacio" itemValue="" noSelectionOption="true" />
                                        <f:selectItems value="#{eventoBean.listaEspacios}" var="espacio"
                                                       itemValue="#{espacio.idEspacio}"
                                                       itemLabel="#{espacio.nombre}" />
                                        <f:ajax event="change"
                                                listener="#{eventoBean.validarFechasAjax}"
                                                execute="@form"
                                                render="ocupacionesJson @messages" />
                                    </h:selectOneMenu>
                                    <h:message for="espacio" styleClass="text-danger small" />
                                </div>

                                <div class="col-md-6">
                                    <label for="usuario" class="form-label">Huésped</label>
                                    <h:selectOneMenu id="usuario" value="#{eventoBean.usuarioIdSeleccionado}"
                                                     styleClass="form-select"
                                                     required="true"
                                                     requiredMessage="Debe seleccionar un huésped.">
                                        <f:selectItem itemLabel="Seleccione un huésped" itemValue="" noSelectionOption="true" />
                                        <f:selectItems value="#{eventoBean.listaUsuarios}" var="usuario"
                                                       itemValue="#{usuario.idUsuario}"
                                                       itemLabel="#{usuario.nombre}" />
                                    </h:selectOneMenu>
                                    <h:message for="usuario" styleClass="text-danger small" />
                                </div>

                                <div class="col-md-6">
                                    <label for="estado" class="form-label">Estado</label>
                                    <h:selectOneMenu id="estado" value="#{eventoBean.evento.estado}" styleClass="form-select"
                                                     required="true"
                                                     requiredMessage="Debe seleccionar un estado.">
                                        <f:selectItems value="#{eventoBean.estados}" />
                                    </h:selectOneMenu>
                                    <h:message for="estado" styleClass="text-danger small" />
                                </div>

                                <div class="col-12">
                                    <label for="observaciones" class="form-label">Observaciones</label>
                                    <h:inputTextarea id="observaciones" value="#{eventoBean.evento.descripcion}" 
                                                     styleClass="form-control" rows="3" />
                                </div>

                                <div class="col-12 d-flex justify-content-end mt-3">
                                    <h:commandButton value="Guardar" action="#{eventoBean.guardar}" styleClass="btn btn-primary me-2" />
                                    <h:link outcome="/Eventos.xhtml" styleClass="btn btn-secondary">Cancelar</h:link>
                                </div>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>

  <script>
function inicializarPickersEvento() {
    if (!window.flatpickr) {
        return;
    }

    flatpickr.localize(flatpickr.l10ns.es);

    var fecha = document.getElementById("formEvento:fechaEvento");
    if (fecha) {
        if (fecha._flatpickr) {
            fecha._flatpickr.destroy();
        }
        flatpickr(fecha, {
            enableTime: false,
            dateFormat: "Y-m-d",
            minDate: "today",
            allowInput: true,
            defaultDate: fecha.value || null
        });
    }

    var horaInicio = document.getElementById("formEvento:horaInicio");
    if (horaInicio) {
        if (horaInicio._flatpickr) {
            horaInicio._flatpickr.destroy();
        }
        flatpickr(horaInicio, {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            allowInput: true,
            defaultDate: horaInicio.value || null
        });
    }

    var horaFin = document.getElementById("formEvento:horaFin");
    if (horaFin) {
        if (horaFin._flatpickr) {
            horaFin._flatpickr.destroy();
        }
        flatpickr(horaFin, {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            allowInput: true,
            defaultDate: horaFin.value || null
        });
    }
}

document.addEventListener("DOMContentLoaded", inicializarPickersEvento);

if (window.jsf &amp;&amp; jsf.ajax) {
    jsf.ajax.addOnEvent(function (data) {
        if (data.status === 'success') {
            inicializarPickersEvento();
        }
    });
}
</script>

    </h:body>
</html>
