<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="es">
    <f:metadata>
        <f:viewAction action="#{tipoHabitacionBean.cargarTipoPorId()}" />
    </f:metadata>
    <h:head>
        <title>Editar Reserva</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
        <link rel="stylesheet" href="../css/admin-crud.css" />
</h:head>

    <h:body>
        <div class="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-hotel"></i> StayWell</h4>
                <p>Panel Admin</p>
            </div>

            <nav class="sidebar-nav">
                <h:link outcome="/HomeAdmin.xhtml" styleClass="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</h:link>
                <h:link outcome="/Habitaciones.xhtml" styleClass="nav-link"><i class="bi bi-door-open me-2"></i> Habitaciones</h:link>
                <h:link outcome="/TipoHabitacion.xhtml" styleClass="nav-link active"><i class="bi bi-journal-bookmark me-2"></i> Catalogo Habitaciones</h:link>
                <h:link outcome="/Eventos.xhtml" styleClass="nav-link"><i class="bi bi-calendar-event me-2"></i> Eventos</h:link>
                <h:link outcome="/Usuarios.xhtml" styleClass="nav-link"><i class="bi bi-people me-2"></i> Usuarios</h:link>
                <h:link outcome="/Reservas.xhtml" styleClass="nav-link"><i class="bi bi-journal-bookmark me-2"></i> Reservas</h:link>
                <h:link outcome="/Empleados.xhtml" styleClass="nav-link"><i class="bi bi-person-badge me-2"></i> Empleados</h:link>
                <h:link outcome="/Espacios.xhtml" styleClass="nav-link"><i class="bi bi-building me-2"></i> Espacios</h:link>
                <h:link outcome="/Correos.xhtml" styleClass="nav-link"><i class="bi bi-envelope me-2"></i> Correos</h:link>
                <h:link outcome="/.xhtml" styleClass="nav-link"><i class="bi bi-bar-chart me-2"></i> Mantenimientos</h:link>
            </nav>

            <h:form>
                <div class="sidebar-footer">
                    <h:commandLink action="#{usuarioBean.cerrarSesion}" styleClass="btn btn-outline-light btn-sm w-100">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </h:commandLink>
                </div>
            </h:form>
        </div>

        <div class="main-content">
            <div class="top-bar d-flex justify-content-between align-items-center">
                <h2><i class="bi bi-pencil-square"></i> Editar Reserva</h2>
                <h:link outcome="/Habitaciones.xhtml" styleClass="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </h:link>
            </div>

            <div class="mt-4 form-card">
                <h:messages styleClass="alert alert-warning" layout="table" />

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Actualizar datos</h5>

                      <h:form id="formTipoHabitacion" enctype="multipart/form-data" styleClass="habitacion-form">

                    <div class="row g-3">
                        
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <h:inputText id="nombre" value="#{tipoHabitacionBean.tipoHabitacion.nombre}" 
                                         styleClass="form-control" required="true" />
                        </div>

                        <div class="col-md-6">
                            <label for="capacidad" class="form-label">Capacidad</label>
                            <h:inputText id="capacidad" value="#{tipoHabitacionBean.tipoHabitacion.capacidad}" 
                                         styleClass="form-control" required="true" />
                        </div>

                        <div class="col-md-6">
                            <label for="precio" class="form-label">Precio</label>
                            <h:inputText id="precio" value="#{tipoHabitacionBean.tipoHabitacion.precio}" 
                                         styleClass="form-control" required="true" />
                        </div>

                        <div class="col-md-6">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <h:inputTextarea id="descripcion" value="#{tipoHabitacionBean.tipoHabitacion.descripcion}" 
                                             styleClass="form-control" rows="2" required="true" />
                        </div>

                        <!-- Imagen actual -->
                        <div class="col-md-6 text-center">
                            <label class="form-label d-block">Imagen actual</label>
                            <h:graphicImage value="#{'/img/' += tipoHabitacionBean.tipoHabitacion.imagen}" 
                                            width="200" height="140" 
                                            rendered="#{not empty tipoHabitacionBean.tipoHabitacion.imagen}" 
                                            style="border-radius: 10px; border: 1px solid #ccc; padding: 5px;" />
                            <h:outputText value="(Sin imagen)" 
                                          rendered="#{empty tipoHabitacionBean.tipoHabitacion.imagen}" />
                        </div>

                        <!-- Nueva imagen -->
                        <div class="col-md-6">
                            <label for="imagenNueva" class="form-label">Subir nueva imagen</label>
                            <h:inputFile id="imagenNueva" value="#{tipoHabitacionBean.imagen}" styleClass="form-control" />
                            <small class="text-muted">Opcional: selecciona una imagen para reemplazar la actual.</small>
                        </div>

                        <div class="col-12 d-flex justify-content-end mt-3">
                            <h:commandButton value="Actualizar" action="#{tipoHabitacionBean.actualizar()}" 
                                             styleClass="btn btn-primary me-2" />
                            <h:link outcome="/TipoHabitacion.xhtml" styleClass="btn btn-secondary">
                                Cancelar
                            </h:link>
                        </div>

                    </div>
                </h:form>
                    </div>
                </div>
            </div>
        </div>
        
    </h:body>
</html>
